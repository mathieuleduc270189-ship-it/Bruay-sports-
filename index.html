<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bruay Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#B7282C;
    --pitch-light:#D14F44;
    --chalk:#F4F2ED;
    --chalk-dim:#E7E3D9;
    --navy:#161616;
    --gold:#FFFFFF;
    --score:#8A1F22;
    --card-bg:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--navy);
    font-family:'Source Sans 3', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin:0;
  }
  a{color:inherit;}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    color:var(--chalk);
    position:sticky;
    top:0;
    z-index:50;
    border-bottom:4px solid var(--gold);
  }
  .header-inner{
    max-width:960px;
    margin:0 auto;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .crest{
    width:44px;height:44px;
    border-radius:8px;
    background:#000000;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  .crest img{width:100%;height:100%;object-fit:cover;}
  .brand-name{
    font-size:1.25rem;
    line-height:1.1;
    font-weight:700;
  }
  .brand-sub{
    font-family:'Source Sans 3', sans-serif;
    text-transform:none;
    font-size:0.72rem;
    color:var(--pitch-light);
    letter-spacing:0.03em;
  }
  .admin-btn{
    background:none;
    border:1px solid rgba(238,237,228,0.3);
    color:var(--chalk);
    padding:7px 12px;
    font-size:0.78rem;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .admin-btn.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--navy);
    font-weight:600;
  }
  nav{
    background:var(--pitch);
    display:flex;
    max-width:960px;
    margin:0 auto;
  }
  nav button{
    flex:1;
    background:none;
    border:none;
    color:var(--chalk);
    padding:11px 8px;
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:0.82rem;
    letter-spacing:0.04em;
    border-bottom:3px solid transparent;
    opacity:0.75;
  }
  nav button.tab-active{
    opacity:1;
    border-bottom-color:var(--gold);
    background:rgba(0,0,0,0.12);
  }
  /* ---------- Layout ---------- */
  main{
    max-width:960px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    border-bottom:2px solid var(--navy);
    padding-bottom:8px;
  }
  .section-head h2{font-size:1.35rem;}
  .add-btn{
    background:var(--pitch);
    color:var(--chalk);
    border:none;
    padding:7px 12px;
    font-size:0.78rem;
    font-weight:600;
    display:flex;align-items:center;gap:5px;
  }
  .empty{
    padding:28px 16px;
    text-align:center;
    color:#6b7268;
    background:var(--card-bg);
    border:1px dashed #c9c6b8;
  }
  /* ---------- News ---------- */
  .news-featured{
    background:var(--card-bg);
    border-left:5px solid var(--pitch);
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .news-featured .tag{
    font-family:'Oswald',sans-serif;
    font-size:0.7rem;
    color:var(--score);
    letter-spacing:0.05em;
  }
  .news-featured h3{font-size:1.3rem;margin:6px 0 8px;}
  .news-date{font-size:0.78rem;color:#787566;margin-bottom:10px;}
  .news-body{line-height:1.55;color:#2c342d;}
  .news-card{
    background:var(--card-bg);
    border-left:5px solid var(--pitch);
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.05);
    position:relative;
  }
  .news-card h3{font-size:1.02rem;margin-bottom:4px;}
  .item-actions{
    position:absolute;
    top:10px;right:10px;
    display:flex;gap:6px;
  }
  .icon-btn{
    background:none;border:none;
    padding:4px;
    color:#8a8776;
  }
  .icon-btn:hover{color:var(--navy);}
  .icon-btn svg{width:16px;height:16px;display:block;}
  /* ---------- Teams ---------- */
  .team-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .team-tabs button{
    background:var(--card-bg);
    border:1px solid var(--chalk-dim);
    padding:6px 12px;
    font-size:0.82rem;
    font-weight:600;
  }
  .team-tabs button.team-tab-active{
    background:var(--pitch);
    color:var(--chalk);
    border-color:var(--pitch);
  }
  .team-card{
    background:var(--card-bg);
    padding:16px;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
    margin-bottom:16px;
  }
  .team-card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .player-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--chalk-dim);
    font-size:0.92rem;
  }
  .player-row:last-child{border-bottom:none;}
  .player-num{
    display:inline-block;
    width:26px;height:26px;
    line-height:26px;
    text-align:center;
    background:var(--pitch);
    color:var(--chalk);
    font-family:'Oswald',sans-serif;
    font-size:0.78rem;
    margin-right:10px;
    flex-shrink:0;
  }
  .player-name{flex:1;}
  .player-pos{color:#787566;font-size:0.8rem;}
  /* ---------- Calendar ---------- */
  .match-row{
    background:var(--card-bg);
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 14px;
    margin-bottom:8px;
    box-shadow:0 1px 2px rgba(0,0,0,0.05);
    border-left:5px solid var(--chalk-dim);
    position:relative;
  }
  .match-row.played{border-left-color:var(--navy);}
  .match-row.upcoming{border-left-color:var(--pitch);}
  .match-date{
    font-family:'Oswald',sans-serif;
    font-size:0.78rem;
    color:#787566;
    width:64px;
    flex-shrink:0;
    line-height:1.2;
  }
  .match-teams{
    flex:1;
    min-width:0;
  }
  .match-teams .comp{font-size:0.72rem;color:var(--score);letter-spacing:0.03em;text-transform:uppercase;font-family:'Oswald',sans-serif;}
  .match-teams .versus{font-weight:600;font-size:0.95rem;margin-top:2px;}
  .match-score{
    font-family:'Oswald',sans-serif;
    font-size:1.1rem;
    font-weight:600;
    flex-shrink:0;
    padding-right:34px;
  }
  .badge{
    font-size:0.68rem;
    font-family:'Oswald',sans-serif;
    padding:2px 6px;
    background:var(--chalk-dim);
    color:#5c5a4d;
    margin-left:6px;
  }
  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,32,43,0.55);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:100;
    padding:0;
  }
  @media(min-width:640px){
    .overlay{align-items:center;padding:20px;}
  }
  .modal{
    background:var(--chalk);
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    padding:20px;
    border-top:4px solid var(--pitch);
  }
  @media(min-width:640px){ .modal{border-top:4px solid var(--pitch);} }
  .modal h3{font-size:1.1rem;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:0.78rem;
    font-weight:600;
    margin-bottom:4px;
    color:#4a4d43;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid #c9c6b8;
    background:#fff;
    font-family:inherit;
    font-size:0.92rem;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .row2{display:flex;gap:10px;}
  .row2 > .field{flex:1;}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .btn-primary{
    background:var(--pitch);
    color:#fff;
    border:none;
    padding:10px 16px;
    font-weight:600;
    flex:1;
  }
  .btn-secondary{
    background:none;
    border:1px solid #c9c6b8;
    padding:10px 16px;
    flex:1;
  }
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .checkbox-row input{width:auto;}
  .toast{
    position:fixed;
    bottom:18px;left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:var(--chalk);
    padding:10px 18px;
    font-size:0.85rem;
    z-index:200;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .loading-msg{
    text-align:center;
    padding:40px;
    color:#787566;
  }
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDUjCbwmFArqAVoNdR11BIGTKH_JNL629g",
  authDomain: "bruay-sports.firebaseapp.com",
  projectId: "bruay-sports",
  storageBucket: "bruay-sports.firebasestorage.app",
  messagingSenderId: "994855695086",
  appId: "1:994855695086:web:4db3bb8f2475dbe1f0f9ff"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>
<script>
// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let state = { news: [], teams: [], matches: [] };
let ui = { tab: 'news', adminMode: false, activeTeamId: null };
const ADMIN_CODE = 'BRUAY2026';

// ---------------------------------------------------------------
// Storage helpers
// ---------------------------------------------------------------
async function loadKey(key){
  try{
    const doc = await db.collection('site-data').doc(key).get();
    return doc.exists ? doc.data().value : null;
  }catch(e){
    console.error(e);
    return null;
  }
}
async function saveKey(key, value){
  try{
    await db.collection('site-data').doc(key).set({ value: value });
    return true;
  }catch(e){
    console.error(e);
    showToast("Erreur : la sauvegarde a échoué.");
    return false;
  }
}

function seedData(){
  return {
    news: [
      {
        id: 'n1',
        title: "Bruay Sports, le club rouge et noir du District Escaut",
        date: '2026-09-10',
        body: "Bruay Sports regroupe toutes les catégories d'âge, les féminines, le futsal et le foot loisir, dès 5 ans. Le club est présidé par Frédéric Lemay et évolue au sein de la Ligue de Football des Hauts-de-France, District Escaut (n° d'affiliation FFF 500936). L'équipe s'entraîne et joue au Complexe Sportif J.-Ph. Gatien, à Bruay-sur-l'Escaut."
      },
      {
        id: 'n2',
        title: "C'est reparti pour la saison 2026-2027 !",
        date: '2026-09-09',
        body: "La Rentrée du Foot 2026 vient de sonner au niveau national, et toutes les équipes du club reprennent le chemin des terrains. Le Pass Sport 2026-2027 est reconduit et renforcé pour aider les jeunes à prendre leur licence : n'hésitez pas à vous renseigner auprès du club pour rejoindre une équipe."
      }
    ],
    teams: [
      { id: 't1', name: 'Seniors', players: [] },
      { id: 't2', name: 'Seniors 2', players: [] },
      { id: 't3', name: 'Féminines', players: [] },
      { id: 't4', name: 'U17 - U16', players: [] },
      { id: 't5', name: 'U15 - U14', players: [] },
      { id: 't6', name: 'U13 - U12', players: [] },
      { id: 't7', name: 'Futsal', players: [] },
      { id: 't8', name: 'Loisirs', players: [] }
    ],
    matches: []
  };
}

async function init(){
  const [news, teams, matches] = await Promise.all([
    loadKey('news-list'), loadKey('teams-list'), loadKey('matches-list')
  ]);
  if(news === null && teams === null && matches === null){
    const seed = seedData();
    state = seed;
    await Promise.all([
      saveKey('news-list', seed.news),
      saveKey('teams-list', seed.teams),
      saveKey('matches-list', seed.matches)
    ]);
  }else{
    state.news = news || [];
    state.teams = teams || [];
    state.matches = matches || [];
  }
  if(state.teams.length) ui.activeTeamId = state.teams[0].id;
  render();
}

// ---------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------
function uid(){ return Math.random().toString(36).slice(2,9); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' });
}
function fmtDateLong(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
}
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}
function showToast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  setTimeout(()=>{ root.innerHTML=''; }, 2600);
}
const ICON = {
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 000-3L18 6a2.1 2.1 0 00-3 0L4.5 16.5V20z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0l-1 13a1 1 0 01-1 1H8a1 1 0 01-1-1L6 7"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`
};

// ---------------------------------------------------------------
// Render
// ---------------------------------------------------------------
function render(){
  const main = document.getElementById('main');
  if(ui.tab === 'news') main.innerHTML = renderNews();
  else if(ui.tab === 'teams') main.innerHTML = renderTeams();
  else main.innerHTML = renderCalendar();
  attachMainListeners();
  document.getElementById('adminBtn').classList.toggle('active', ui.adminMode);
  document.getElementById('adminBtnLabel').textContent = ui.adminMode ? 'Mode gestion actif' : 'Gestion';
}

function renderNews(){
  const sorted = [...state.news].sort((a,b)=> b.date.localeCompare(a.date));
  let html = `<div class="section-head"><h2>Actualités</h2>`;
  if(ui.adminMode) html += `<button class="add-btn" data-action="add-news">${ICON.plus}Ajouter</button>`;
  html += `</div>`;
  if(!sorted.length){
    html += `<div class="empty">Aucune actualité pour le moment.</div>`;
    return html;
  }
  const [first, ...rest] = sorted;
  html += `<div class="news-featured">
      <div class="tag">À la une</div>
      <h3>${escapeHtml(first.title)}</h3>
      <div class="news-date">${fmtDateLong(first.date)}</div>
      <div class="news-body">${escapeHtml(first.body)}</div>
      ${ui.adminMode ? adminActions('news', first.id) : ''}
    </div>`;
  rest.forEach(n=>{
    html += `<div class="news-card">
        ${ui.adminMode ? adminActions('news', n.id) : ''}
        <h3>${escapeHtml(n.title)}</h3>
        <div class="news-date">${fmtDateLong(n.date)}</div>
        <div class="news-body">${escapeHtml(n.body)}</div>
      </div>`;
  });
  return html;
}

function renderTeams(){
  let html = `<div class="section-head"><h2>Équipes</h2>`;
  if(ui.adminMode) html += `<button class="add-btn" data-action="add-team">${ICON.plus}Équipe</button>`;
  html += `</div>`;
  if(!state.teams.length){
    html += `<div class="empty">Aucune équipe enregistrée.</div>`;
    return html;
  }
  html += `<div class="team-tabs">`;
  state.teams.forEach(t=>{
    html += `<button data-team="${t.id}" class="${t.id===ui.activeTeamId?'team-tab-active':''}">${escapeHtml(t.name)}</button>`;
  });
  html += `</div>`;
  const team = state.teams.find(t=>t.id===ui.activeTeamId) || state.teams[0];
  if(team){
    html += `<div class="team-card">
      <div class="team-card-head">
        <h3>${escapeHtml(team.name)}</h3>
        ${ui.adminMode ? `<div style="display:flex;gap:10px;">
            <button class="icon-btn" data-action="add-player" data-team="${team.id}" title="Ajouter un joueur">${ICON.plus}</button>
            <button class="icon-btn" data-action="edit-team" data-team="${team.id}" title="Renommer">${ICON.edit}</button>
            <button class="icon-btn" data-action="delete-team" data-team="${team.id}" title="Supprimer l'équipe">${ICON.trash}</button>
          </div>` : ''}
      </div>`;
    if(!team.players.length){
      html += `<div class="empty">Aucun joueur ajouté.</div>`;
    }else{
      team.players.forEach(p=>{
        html += `<div class="player-row">
            <span class="player-num">${escapeHtml(p.num||'-')}</span>
            <span class="player-name">${escapeHtml(p.name)}</span>
            <span class="player-pos">${escapeHtml(p.pos||'')}</span>
            ${ui.adminMode ? `<span style="display:flex;gap:4px;margin-left:8px;">
                <button class="icon-btn" data-action="edit-player" data-team="${team.id}" data-player="${p.id}">${ICON.edit}</button>
                <button class="icon-btn" data-action="delete-player" data-team="${team.id}" data-player="${p.id}">${ICON.trash}</button>
              </span>` : ''}
          </div>`;
      });
    }
    html += `</div>`;
  }
  return html;
}

function renderCalendar(){
  const sorted = [...state.matches].sort((a,b)=> a.date.localeCompare(b.date));
  let html = `<div class="section-head"><h2>Calendrier</h2>`;
  if(ui.adminMode) html += `<button class="add-btn" data-action="add-match">${ICON.plus}Match</button>`;
  html += `</div>`;
  if(!sorted.length){
    html += `<div class="empty">Aucun match programmé.</div>`;
    return html;
  }
  sorted.forEach(m=>{
    const scoreTxt = m.played ? `${m.homeScore ?? 0} - ${m.awayScore ?? 0}` : fmtDate(m.date);
    html += `<div class="match-row ${m.played?'played':'upcoming'}">
        <div class="match-date">${fmtDate(m.date)}</div>
        <div class="match-teams">
          <div class="comp">${escapeHtml(m.competition||'')} ${m.played?'':'<span class=\"badge\">À venir</span>'}</div>
          <div class="versus">${escapeHtml(m.home)} — ${escapeHtml(m.away)}</div>
        </div>
        <div class="match-score">${m.played ? (m.homeScore+' - '+m.awayScore) : ''}</div>
        ${ui.adminMode ? `<div class="item-actions" style="top:12px;">
            <button class="icon-btn" data-action="edit-match" data-id="${m.id}">${ICON.edit}</button>
            <button class="icon-btn" data-action="delete-match" data-id="${m.id}">${ICON.trash}</button>
          </div>` : ''}
      </div>`;
  });
  return html;
}

function adminActions(type, id){
  return `<div class="item-actions">
      <button class="icon-btn" data-action="edit-${type}" data-id="${id}">${ICON.edit}</button>
      <button class="icon-btn" data-action="delete-${type}" data-id="${id}">${ICON.trash}</button>
    </div>`;
}

// ---------------------------------------------------------------
// Event wiring
// ---------------------------------------------------------------
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('tab-active'));
    btn.classList.add('tab-active');
    ui.tab = btn.dataset.tab;
    render();
  });
});

document.getElementById('adminBtn').addEventListener('click', ()=>{
  if(ui.adminMode){
    ui.adminMode = false;
    render();
    showToast('Mode gestion désactivé.');
  }else{
    openCodeModal();
  }
});

function attachMainListeners(){
  const main = document.getElementById('main');
  main.querySelectorAll('[data-team]').forEach(el=>{
    if(el.dataset.action) return;
    el.addEventListener('click', ()=>{ ui.activeTeamId = el.dataset.team; render(); });
  });
  main.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=> handleAction(el.dataset));
  });
}

function handleAction(d){
  const action = d.action;
  if(action==='add-news') openNewsModal();
  else if(action==='edit-news') openNewsModal(state.news.find(n=>n.id===d.id));
  else if(action==='delete-news') confirmDelete('actualité', ()=>deleteItem('news', d.id));
  else if(action==='add-team') openTeamModal();
  else if(action==='edit-team') openTeamModal(state.teams.find(t=>t.id===d.team));
  else if(action==='delete-team') confirmDelete('équipe (et ses joueurs)', ()=>deleteTeam(d.team));
  else if(action==='add-player') openPlayerModal(d.team);
  else if(action==='edit-player') openPlayerModal(d.team, findPlayer(d.team,d.player));
  else if(action==='delete-player') confirmDelete('joueur', ()=>deletePlayer(d.team,d.player));
  else if(action==='add-match') openMatchModal();
  else if(action==='edit-match') openMatchModal(state.matches.find(m=>m.id===d.id));
  else if(action==='delete-match') confirmDelete('match', ()=>deleteItem('matches', d.id));
}

function findPlayer(teamId, playerId){
  const t = state.teams.find(t=>t.id===teamId);
  return t ? t.players.find(p=>p.id===playerId) : null;
}

// ---------------------------------------------------------------
// Modals
// ---------------------------------------------------------------
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openCodeModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov">
    <div class="modal">
      <h3>Mode gestion</h3>
      <p style="font-size:0.85rem;color:#5c5a4d;margin-top:-6px;">Entrez le code d'administration du club pour ajouter ou modifier le contenu du site.</p>
      <div class="field"><label>Code</label><input type="password" id="codeInput" autofocus></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelCode">Annuler</button>
        <button class="btn-primary" id="confirmCode">Valider</button>
      </div>
    </div>
  </div>`;
  document.getElementById('cancelCode').onclick = closeModal;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('confirmCode').onclick = ()=>{
    const val = document.getElementById('codeInput').value;
    if(val === ADMIN_CODE){
      ui.adminMode = true;
      closeModal();
      render();
      showToast('Mode gestion activé.');
    }else{
      showToast('Code incorrect.');
    }
  };
}

function confirmDelete(label, onConfirm){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov">
    <div class="modal">
      <h3>Supprimer</h3>
      <p style="font-size:0.9rem;">Confirmer la suppression de : ${escapeHtml(label)} ?</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelDel">Annuler</button>
        <button class="btn-primary" style="background:#9C3B31;" id="confirmDel">Supprimer</button>
      </div>
    </div>
  </div>`;
  document.getElementById('cancelDel').onclick = closeModal;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('confirmDel').onclick = async ()=>{ closeModal(); await onConfirm(); };
}

function openNewsModal(item){
  const isEdit = !!item;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal">
    <h3>${isEdit?'Modifier':'Ajouter'} une actualité</h3>
    <div class="field"><label>Titre</label><input id="fTitle" value="${item?escapeHtml(item.title):''}"></div>
    <div class="field"><label>Date</label><input type="date" id="fDate" value="${item?item.date:new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Texte</label><textarea id="fBody">${item?escapeHtml(item.body):''}</textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancel">Annuler</button>
      <button class="btn-primary" id="save">Enregistrer</button>
    </div>
  </div></div>`;
  document.getElementById('cancel').onclick = closeModal;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('save').onclick = async ()=>{
    const title = document.getElementById('fTitle').value.trim();
    const date = document.getElementById('fDate').value;
    const body = document.getElementById('fBody').value.trim();
    if(!title){ showToast('Le titre est obligatoire.'); return; }
    if(isEdit){
      item.title=title; item.date=date; item.body=body;
    }else{
      state.news.push({ id:uid(), title, date, body });
    }
    closeModal();
    const ok = await saveKey('news-list', state.news);
    if(ok) showToast('Actualité enregistrée.');
    render();
  };
}

function deleteItem(key, id){
  return (async ()=>{
    state[key] = state[key].filter(x=>x.id!==id);
    const ok = await saveKey(key+'-list', state[key]);
    if(ok) showToast('Supprimé.');
    render();
  })();
}

function openTeamModal(team){
  const isEdit = !!team;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal">
    <h3>${isEdit?'Renommer l’équipe':'Nouvelle équipe'}</h3>
    <div class="field"><label>Nom de l'équipe</label><input id="fName" value="${team?escapeHtml(team.name):''}" placeholder="Ex : Seniors B"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancel">Annuler</button>
      <button class="btn-primary" id="save">Enregistrer</button>
    </div>
  </div></div>`;
  document.getElementById('cancel').onclick = closeModal;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('save').onclick = async ()=>{
    const name = document.getElementById('fName').value.trim();
    if(!name){ showToast("Le nom est obligatoire."); return; }
    if(isEdit){
      team.name = name;
    }else{
      const t = { id:uid(), name, players:[] };
      state.teams.push(t);
      ui.activeTeamId = t.id;
    }
    closeModal();
    const ok = await saveKey('teams-list', state.teams);
    if(ok) showToast('Équipe enregistrée.');
    render();
  };
}

function deleteTeam(teamId){
  return (async ()=>{
    state.teams = state.teams.filter(t=>t.id!==teamId);
    if(ui.activeTeamId===teamId) ui.activeTeamId = state.teams[0] ? state.teams[0].id : null;
    const ok = await saveKey('teams-list', state.teams);
    if(ok) showToast('Équipe supprimée.');
    render();
  })();
}

function openPlayerModal(teamId, player){
  const isEdit = !!player;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal">
    <h3>${isEdit?'Modifier le joueur':'Ajouter un joueur'}</h3>
    <div class="field"><label>Nom</label><input id="fName" value="${player?escapeHtml(player.name):''}"></div>
    <div class="row2">
      <div class="field"><label>Numéro</label><input id="fNum" value="${player?escapeHtml(player.num||''):''}"></div>
      <div class="field"><label>Poste</label><input id="fPos" value="${player?escapeHtml(player.pos||''):''}" placeholder="Gardien, Défenseur…"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancel">Annuler</button>
      <button class="btn-primary" id="save">Enregistrer</button>
    </div>
  </div></div>`;
  document.getElementById('cancel').onclick = closeModal;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('save').onclick = async ()=>{
    const name = document.getElementById('fName').value.trim();
    const num = document.getElementById('fNum').value.trim();
    const pos = document.getElementById('fPos').value.trim();
    if(!name){ showToast('Le nom est obligatoire.'); return; }
    const team = state.teams.find(t=>t.id===teamId);
    if(isEdit){
      player.name=name; player.num=num; player.pos=pos;
    }else{
      team.players.push({ id:uid(), name, num, pos });
    }
    closeModal();
    const ok = await saveKey('teams-list', state.teams);
    if(ok) showToast('Joueur enregistré.');
    render();
  };
}

function deletePlayer(teamId, playerId){
  return (async ()=>{
    const team = state.teams.find(t=>t.id===teamId);
    team.players = team.players.filter(p=>p.id!==playerId);
    const ok = await saveKey('teams-list', state.teams);
    if(ok) showToast('Joueur supprimé.');
    render();
  })();
}

function openMatchModal(match){
  const isEdit = !!match;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal">
    <h3>${isEdit?'Modifier le match':'Ajouter un match'}</h3>
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="fDate" value="${match?match.date:new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Compétition</label><input id="fComp" value="${match?escapeHtml(match.competition||''):''}" placeholder="Championnat, Coupe…"></div>
    </div>
    <div class="field"><label>Équipe à domicile</label><input id="fHome" value="${match?escapeHtml(match.home):'Bruay Sports'}"></div>
    <div class="field"><label>Équipe à l'extérieur</label><input id="fAway" value="${match?escapeHtml(match.away):''}"></div>
    <div class="checkbox-row"><input type="checkbox" id="fPlayed" ${match&&match.played?'checked':''}><label for="fPlayed" style="margin:0;">Match déjà joué (renseigner le score)</label></div>
    <div class="row2">
      <div class="field"><label>Score domicile</label><input type="number" min="0" id="fHomeScore" value="${match&&match.homeScore!=null?match.homeScore:''}"></div>
      <div class="field"><label>Score extérieur</label><input type="number" min="0" id="fAwayScore" value="${match&&match.awayScore!=null?match.awayScore:''}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancel">Annuler</button>
      <button class="btn-primary" id="save">Enregistrer</button>
    </div>
  </div></div>`;
  document.getElementById('cancel').onclick = closeModal;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('save').onclick = async ()=>{
    const date = document.getElementById('fDate').value;
    const competition = document.getElementById('fComp').value.trim();
    const home = document.getElementById('fHome').value.trim();
    const away = document.getElementById('fAway').value.trim();
    const played = document.getElementById('fPlayed').checked;
    const hs = document.getElementById('fHomeScore').value;
    const as = document.getElementById('fAwayScore').value;
    if(!home || !away){ showToast('Les deux équipes sont obligatoires.'); return; }
    const data = {
      date, competition, home, away, played,
      homeScore: played && hs!=='' ? parseInt(hs) : null,
      awayScore: played && as!=='' ? parseInt(as) : null
    };
    if(isEdit){
      Object.assign(match, data);
    }else{
      state.matches.push({ id:uid(), ...data });
    }
    closeModal();
    const ok = await saveKey('matches-list', state.matches);
    if(ok) showToast('Match enregistré.');
    render();
  };
}

init();
</script>
